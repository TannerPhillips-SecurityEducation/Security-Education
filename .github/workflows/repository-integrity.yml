name: Repository AGENTS and knowledge navigation integrity

on:
  push:
    paths:
      - "**/*.md"
      - "*.md"
      - "tools/check_repository_integrity.py"
      - "tools/report_knowledge_coverage.py"
      - ".github/workflows/repository-integrity.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "*.md"
      - "tools/check_repository_integrity.py"
      - ".github/workflows/repository-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate all Markdown links and AGENTS inheritance
        run: python3 tools/check_repository_integrity.py
      - name: Report live knowledge coverage and domain article maturity (diagnostic)
        run: python3 tools/report_knowledge_coverage.py
      - name: Reconcile Fundamentals live subjects and review states
        run: python3 foundations/fundamentals/tools/check_inventory.py
      - name: Reconcile Security Foundations candidates and pilot states
        run: python3 foundations/security-foundations/tools/check_candidate_inventory.py
      - name: Cross-check provisional Security Foundations area directory and article structure
        run: python3 foundations/security-foundations/tools/check_area_structure.py
      - name: Verify Security Foundations structural records
        run: python3 foundations/security-foundations/tools/check_foundations_structure.py
