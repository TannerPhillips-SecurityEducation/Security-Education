name: Security Foundations working architecture and pilot integrity

on:
  push:
    paths:
      - "foundations/security-foundations/**"
      - ".github/workflows/security-foundations-integrity.yml"
  pull_request:
    paths:
      - "foundations/security-foundations/**"
      - ".github/workflows/security-foundations-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify working candidate inventory, pilot references and Markdown paths
        run: python3 foundations/security-foundations/tools/check_foundations_structure.py
      - name: Validate Fundamentals-style provisional area indexes and substantive article locations
        run: python3 foundations/security-foundations/tools/check_area_structure.py
      - name: Validate Markdown relative links and heading fragments
        run: python3 foundations/security-foundations/tools/check_internal_links.py
      - name: Cross-check dynamic candidate subject inventory and pilot review states
        run: python3 foundations/security-foundations/tools/check_candidate_inventory.py
